
[functions.scan-receipt]
enabled = true
verify_jwt = false
import_map = "./functions/scan-receipt/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/scan-receipt/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/scan-receipt/*.html" ]

[functions.razorpay-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/razorpay-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/razorpay-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/razorpay-webhook/*.html" ]

[auth]
additional_redirect_urls = []
enable_anonymous_sign_ins = true
site_url = "https://lakshit-loy-dutta.github.io/ekwly/"

[auth.email]
enable_confirmations = true
max_frequency = "1m0s"
otp_length = 8

[auth.sms]
enable_confirmations = true

[auth.external.google]
client_id = "437284595099-d27vcft3c0lhgo92kdqpf6d6l7ol281q.apps.googleusercontent.com"
enabled = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[db.pooler]
default_pool_size = 15
max_client_conn = 200

[storage.vector]
enabled = false
