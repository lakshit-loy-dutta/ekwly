name: Build Native Android APK & iOS IPA

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install & Build Mobile Bundle
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          CAPACITOR_BUILD: 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm astro build
          if [ ! -d "android" ]; then pnpm cap add android; fi
          pnpm cap sync android
          node scripts/configure-native.mjs apk-debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ekwly-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Build & Package Unsigned iOS IPA
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          CAPACITOR_BUILD: 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm astro build
          if [ ! -d "ios" ]; then pnpm cap add ios; fi
          pnpm cap sync ios
          node scripts/configure-native.mjs
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../ekwly-ios-unsigned.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v7
        with:
          name: ekwly-ios-unsigned-ipa
          path: ekwly-ios-unsigned.ipa
